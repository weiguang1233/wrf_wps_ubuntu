name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck when needed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Check Bash syntax
        run: |
          for script in install_wrf_wps.sh install_wrf_wps_452.sh tests/test_versions.sh; do
            bash -n "$script"
          done

      - name: Check whitespace
        run: |
          git diff --check
          git log --check -1

      - name: Run ShellCheck
        run: shellcheck --severity=error install_wrf_wps.sh install_wrf_wps_452.sh tests/test_versions.sh

      - name: Check help path
        run: |
          bash install_wrf_wps.sh --help > help.txt
          grep -Fq -- "--source-method METHOD" help.txt
          grep -Fq -- "--offline" help.txt

      - name: Check version selection and source manifests
        run: bash tests/test_versions.sh
